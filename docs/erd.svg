<svg xmlns="http://www.w3.org/2000/svg" width="980" height="980" viewBox="0 0 980 980" font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="980" height="980" fill="#ffffff"/>
  <text x="32" y="42" font-size="22" font-weight="700" fill="#18181b">회의실 예약 서비스 — ERD</text>
  <text x="32" y="66" font-size="13" fill="#71717a">1:N · 1:1 · M:N 관계와, 중복 차단 EXCLUSION 제약</text>

  <!-- ===== rooms ===== -->
  <rect x="32" y="100" width="210" height="138" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <rect x="32" y="100" width="210" height="34" rx="10" fill="#6366f1"/>
  <rect x="32" y="118" width="210" height="16" fill="#6366f1"/>
  <text x="48" y="123" font-size="15" font-weight="700" fill="#ffffff">rooms</text>
  <text x="226" y="123" font-size="11" fill="#e0e7ff" text-anchor="end">회의실</text>
  <text x="48" y="160" font-size="13" font-weight="700" fill="#18181b">🔑 id</text>
  <text x="226" y="160" font-size="11" fill="#71717a" text-anchor="end">int, PK</text>
  <text x="48" y="184" font-size="13" fill="#27272a">name</text>
  <text x="48" y="208" font-size="13" fill="#27272a">capacity</text>
  <text x="48" y="232" font-size="13" fill="#27272a">created_at</text>

  <!-- ===== reservations ===== -->
  <rect x="360" y="88" width="248" height="236" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <rect x="360" y="88" width="248" height="34" rx="10" fill="#0ea5e9"/>
  <rect x="360" y="106" width="248" height="16" fill="#0ea5e9"/>
  <text x="376" y="111" font-size="15" font-weight="700" fill="#ffffff">reservations</text>
  <text x="592" y="111" font-size="11" fill="#e0f2fe" text-anchor="end">예약</text>
  <text x="376" y="146" font-size="13" font-weight="700" fill="#18181b">🔑 id</text>
  <text x="592" y="146" font-size="11" fill="#71717a" text-anchor="end">int, PK</text>
  <text x="376" y="170" font-size="13" fill="#2563eb">🔗 room_id</text>
  <text x="592" y="170" font-size="11" fill="#71717a" text-anchor="end">FK → rooms</text>
  <text x="376" y="194" font-size="13" fill="#2563eb">🔗 user_id</text>
  <text x="592" y="194" font-size="11" fill="#71717a" text-anchor="end">FK → auth.users</text>
  <text x="376" y="218" font-size="13" fill="#27272a">title</text>
  <text x="376" y="242" font-size="13" fill="#27272a">start_at</text>
  <text x="376" y="266" font-size="13" fill="#27272a">end_at</text>
  <text x="376" y="290" font-size="13" fill="#27272a">status</text>
  <text x="592" y="290" font-size="11" fill="#71717a" text-anchor="end">enum</text>
  <text x="376" y="314" font-size="13" fill="#27272a">created_at</text>

  <!-- ===== auth.users ===== -->
  <rect x="726" y="100" width="212" height="100" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <rect x="726" y="100" width="212" height="34" rx="10" fill="#10b981"/>
  <rect x="726" y="118" width="212" height="16" fill="#10b981"/>
  <text x="742" y="123" font-size="15" font-weight="700" fill="#ffffff">auth.users</text>
  <text x="922" y="123" font-size="11" fill="#d1fae5" text-anchor="end">Supabase Auth</text>
  <text x="742" y="160" font-size="13" font-weight="700" fill="#18181b">🔑 id</text>
  <text x="922" y="160" font-size="11" fill="#71717a" text-anchor="end">uuid, PK</text>
  <text x="742" y="184" font-size="13" fill="#27272a">email …</text>

  <!-- ===== profiles ===== -->
  <rect x="726" y="300" width="212" height="116" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <rect x="726" y="300" width="212" height="34" rx="10" fill="#f59e0b"/>
  <rect x="726" y="318" width="212" height="16" fill="#f59e0b"/>
  <text x="742" y="323" font-size="15" font-weight="700" fill="#ffffff">profiles</text>
  <text x="922" y="323" font-size="11" fill="#fef3c7" text-anchor="end">사용자 정보</text>
  <text x="742" y="360" font-size="13" font-weight="700" fill="#18181b">🔑 id</text>
  <text x="922" y="360" font-size="11" fill="#71717a" text-anchor="end">uuid, PK=FK</text>
  <text x="742" y="384" font-size="13" fill="#27272a">display_name</text>
  <text x="742" y="408" font-size="13" fill="#27272a">department</text>

  <!-- ===== reservation_participants ===== -->
  <rect x="360" y="400" width="248" height="112" rx="10" fill="#f4f4f5" stroke="#d4d4d8"/>
  <rect x="360" y="400" width="248" height="34" rx="10" fill="#ec4899"/>
  <rect x="360" y="418" width="248" height="16" fill="#ec4899"/>
  <text x="376" y="423" font-size="14" font-weight="700" fill="#ffffff">reservation_participants</text>
  <text x="376" y="460" font-size="13" fill="#be185d">🔑🔗 reservation_id</text>
  <text x="592" y="460" font-size="11" fill="#71717a" text-anchor="end">FK</text>
  <text x="376" y="484" font-size="13" fill="#be185d">🔑🔗 user_id</text>
  <text x="592" y="484" font-size="11" fill="#71717a" text-anchor="end">FK → profiles</text>
  <text x="376" y="505" font-size="11" fill="#a1a1aa">복합 PK (두 FK 조합)</text>

  <!-- relationships -->
  <!-- rooms 1:N reservations -->
  <line x1="242" y1="165" x2="360" y2="168" stroke="#6366f1" stroke-width="2"/>
  <text x="256" y="158" font-size="12" font-weight="700" fill="#6366f1">1</text>
  <text x="342" y="158" font-size="12" font-weight="700" fill="#6366f1">N</text>
  <!-- auth.users 1:N reservations -->
  <line x1="726" y1="160" x2="608" y2="192" stroke="#10b981" stroke-width="2"/>
  <text x="708" y="152" font-size="12" font-weight="700" fill="#10b981">1</text>
  <text x="620" y="186" font-size="12" font-weight="700" fill="#10b981">N</text>
  <!-- auth.users 1:1 profiles -->
  <line x1="832" y1="200" x2="832" y2="300" stroke="#f59e0b" stroke-width="2"/>
  <text x="840" y="224" font-size="12" font-weight="700" fill="#f59e0b">1</text>
  <text x="840" y="290" font-size="12" font-weight="700" fill="#f59e0b">1</text>
  <!-- reservations 1:N participants -->
  <line x1="484" y1="324" x2="484" y2="400" stroke="#ec4899" stroke-width="2"/>
  <text x="492" y="344" font-size="12" font-weight="700" fill="#ec4899">1</text>
  <text x="492" y="392" font-size="12" font-weight="700" fill="#ec4899">N</text>
  <!-- profiles 1:N participants -->
  <line x1="726" y1="384" x2="608" y2="470" stroke="#ec4899" stroke-width="2"/>
  <text x="706" y="378" font-size="12" font-weight="700" fill="#ec4899">1</text>
  <text x="620" y="462" font-size="12" font-weight="700" fill="#ec4899">N</text>

  <!-- legend -->
  <text x="32" y="300" font-size="13" font-weight="700" fill="#18181b">관계 유형</text>
  <text x="32" y="324" font-size="12" fill="#52525b">• rooms → reservations : 1 : N</text>
  <text x="32" y="346" font-size="12" fill="#52525b">• auth.users → reservations : 1 : N</text>
  <text x="32" y="368" font-size="12" fill="#52525b">• auth.users ↔ profiles : 1 : 1</text>
  <text x="32" y="390" font-size="12" fill="#52525b">• reservations ↔ profiles : M : N</text>
  <text x="44" y="408" font-size="11" fill="#a1a1aa">(reservation_participants 조인)</text>

  <!-- EXCLUSION callout -->
  <rect x="32" y="560" width="906" height="118" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="52" y="588" font-size="13" font-weight="700" fill="#92400e">★ 핵심 제약 (reservations) — 같은 방 + 겹치는 시간 차단</text>
  <text x="52" y="616" font-size="12" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EXCLUDE USING gist (</text>
  <text x="72" y="636" font-size="12" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">room_id WITH =,  tstzrange(start_at, end_at) WITH &amp;&amp;</text>
  <text x="52" y="656" font-size="12" fill="#78350f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">) WHERE (status = 'confirmed');</text>
</svg>
